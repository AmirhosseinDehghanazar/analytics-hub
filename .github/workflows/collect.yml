name: Collect repository analytics

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch: {} # "Sync now" from the Actions tab

permissions:
  contents: write

concurrency:
  group: repo-analytics-collect
  cancel-in-progress: false

jobs:
  # ── One parallel leg per tracked repository ───────────────────────────────
  collect:
    name: Collect — [${{ matrix.target.provider }}] ${{ matrix.target.repo }}
    runs-on: ubuntu-latest

    strategy:
      # If one target fails, the others still run.
      fail-fast: false
      matrix:
        target:
          # ✏️ GitHub Repositories
          - provider: github
            repo: AmirhosseinDehghanazar/LinkedIn-AutoClicker-Extension
          - provider: github
            repo: AmirhosseinDehghanazar/Hacker-Terminal-Loading-Screen
          - provider: github
            repo: AmirhosseinDehghanazar/2Auth-JS
          - provider: github
            repo: AmirhosseinDehghanazar/3d-404-page
          - provider: github
            repo: AmirhosseinDehghanazar/analytics-hub

          # ✏️ GitLab Repositories
          - provider: gitlab
            repo: AmirhosseinDehghaniazar/LinkedIn-AutoClicker-Extension
          - provider: gitlab
            repo: AmirhosseinDehghaniazar/Hacker-Terminal-Loading-Screen
          - provider: gitlab
            repo: AmirhosseinDehghaniazar/2Auth-JS
          - provider: gitlab
            repo: AmirhosseinDehghaniazar/3d-404-page

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: collector/package-lock.json

      - name: Install collector dependencies
        working-directory: collector
        run: npm ci

      - name: Derive safe directory name
        id: slug
        run: |
          PROV="${{ matrix.target.provider }}"
          RAW_REPO="${{ matrix.target.repo }}"
          CLEAN_REPO=$(echo "$RAW_REPO" | tr '/' '-')
          echo "provider=$PROV" >> "$GITHUB_OUTPUT"
          echo "repo=$RAW_REPO" >> "$GITHUB_OUTPUT"
          echo "slug=${PROV}-${CLEAN_REPO}" >> "$GITHUB_OUTPUT"

      - name: Run collector
        working-directory: collector
        env:
          ANALYTICS_PROVIDER: ${{ matrix.target.provider }}
          ANALYTICS_REPO: ${{ matrix.target.repo }}
          GH_ANALYTICS_TOKEN: ${{ secrets.GH_ANALYTICS_TOKEN || secrets.GITHUB_TOKEN || github.token }}
          GITLAB_ANALYTICS_TOKEN: ${{ secrets.GITLAB_ANALYTICS_TOKEN || secrets.GITLAB_TOKEN }}
          HISTORY_PATH: ${{ github.workspace }}/data/${{ steps.slug.outputs.slug }}/history.json
        run: npm run collect

      - name: Upload dataset as artifact (for the commit step below)
        uses: actions/upload-artifact@v4
        with:
          name: dataset-${{ steps.slug.outputs.slug }}
          path: data/${{ steps.slug.outputs.slug }}/history.json
          if-no-files-found: ignore
          retention-days: 1

  # ── After all legs: regenerate manifest and commit ────────────────────────
  commit:
    name: Regenerate manifest & commit
    needs: collect
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all datasets
        uses: actions/download-artifact@v4
        with:
          pattern: dataset-*
          path: data
          merge-multiple: false

      - name: Flatten artifact directories
        run: |
          for dir in data/dataset-*/; do
            slug="${dir#data/dataset-}"
            slug="${slug%/}"
            mkdir -p "data/$slug"
            mv "$dir/history.json" "data/$slug/history.json" 2>/dev/null || true
            rmdir "$dir" 2>/dev/null || true
          done

      - name: Regenerate manifest.json
        run: |
          node - <<'EOF'
          const fs   = require("fs");
          const path = require("path");

          const dataDir = path.join(process.cwd(), "data");
          const repos   = [];

          for (const entry of fs.readdirSync(dataDir, { withFileTypes: true })) {
            if (!entry.isDirectory()) continue;
            const dirName  = entry.name;
            const histPath = path.join(dataDir, dirName, "history.json");
            if (!fs.existsSync(histPath)) continue;

            let repoSlug = dirName;
            let provider = "github";
            try {
              const hist = JSON.parse(fs.readFileSync(histPath, "utf-8"));
              if (hist.repository?.fullName) repoSlug = hist.repository.fullName;
              if (hist.repository?.provider || hist.provider) provider = hist.repository?.provider || hist.provider;
            } catch {}

            repos.push({
              provider,
              slug:     repoSlug,
              dirName,
              dataPath: `data/${dirName}/history.json`,
            });
          }

          repos.sort((a, b) => a.slug.localeCompare(b.slug));

          const manifest = { schemaVersion: 1, repos };
          fs.writeFileSync(
            path.join(dataDir, "manifest.json"),
            JSON.stringify(manifest, null, 2) + "\n",
            "utf-8"
          );
          console.log(`Manifest written with ${repos.length} repo(s):`, repos.map(r => `[${r.provider}] ${r.slug}`));
          EOF

      - name: Commit datasets and manifest if anything changed
        run: |
          git config user.name  "repo-analytics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit — skipping."
            exit 0
          fi
          git commit -m "chore(analytics): sync traffic data"
          git push
