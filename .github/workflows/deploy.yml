name: Deploy analytics dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "data/**"              # any change under data/ triggers a redeploy
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      # Copy the entire data/ tree (all per-repo subdirectories + manifest.json)
      # into dashboard/public/data/ so the built static site can fetch them.
      - name: Copy datasets into dashboard public assets
        run: |
          mkdir -p dashboard/public/data
          # Copy every per-repo directory
          for dir in data/*/; do
            slug=$(basename "$dir")
            mkdir -p "dashboard/public/data/$slug"
            if [ -f "$dir/history.json" ]; then
              cp "$dir/history.json" "dashboard/public/data/$slug/history.json"
            fi
          done
          # Copy the manifest (lives at root of data/, not in a subdir)
          if [ -f data/manifest.json ]; then
            cp data/manifest.json dashboard/public/manifest.json
          fi

      - name: Build dashboard
        working-directory: dashboard
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build -- --base="$VITE_BASE_PATH"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
